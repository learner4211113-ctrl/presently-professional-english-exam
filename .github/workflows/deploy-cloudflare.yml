name: Deploy exam portal to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check cloudflare/worker.mjs
      - name: Set database ID in deployment config
        run: node -e "const fs=require('fs'); const p='cloudflare/wrangler.toml'; const s=fs.readFileSync(p,'utf8').replace('CREATE_D1_DATABASE_FIRST', process.env.D1_DATABASE_ID); if(s.includes('CREATE_D1_DATABASE_FIRST')) throw new Error('D1_DATABASE_ID is missing'); fs.writeFileSync(p,s);"
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - name: Apply database schema
        run: npx wrangler d1 migrations apply presently-exam-data --remote --config cloudflare/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload protected application secrets
        shell: bash
        run: |
          printf '%s' "$ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL --config cloudflare/wrangler.toml
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --config cloudflare/wrangler.toml
          printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY --config cloudflare/wrangler.toml
          printf '%s' "$DATA_ENCRYPTION_KEY" | npx wrangler secret put DATA_ENCRYPTION_KEY --config cloudflare/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
      - name: Deploy website and secure backend
        run: npx wrangler deploy --config cloudflare/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

